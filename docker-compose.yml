# Entorno local completo: PostgreSQL + API.
#   docker compose up -d db          (solo la base de datos, en el puerto 5433)
#   docker compose up --build        (base de datos + API en http://localhost:3000)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: churapp
      POSTGRES_PASSWORD: local_dev_pg
    ports:
      - '5433:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Crea también la base de pruebas la primera vez.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d churapp']
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:local_dev_pg@db:5432/churapp
      DB_SSL: 'false'
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # Migra, carga los datos demo y arranca.
    command: sh -c "node scripts/migrate.js && node scripts/seed.js && node src/server.js"

volumes:
  pg-data:
